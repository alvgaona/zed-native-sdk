name: Publish to zed-industries/extensions

# Dispatch-only on purpose. COMMITTER_TOKEN is meant to be created at release time and revoked
# after, so a tag push would only ever produce a run that skipped.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
    steps:
      - name: Fail without a token
        if: env.COMMITTER_TOKEN == ''
        run: |
          echo "COMMITTER_TOKEN is not set. Create a classic PAT with repo and workflow scopes," >> $GITHUB_STEP_SUMMARY
          echo "set it with gh secret set COMMITTER_TOKEN, and re-run this workflow." >> $GITHUB_STEP_SUMMARY
          exit 1
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: native-sdk
          tag: ${{ inputs.tag }}
          push-to: alvgaona/zed-extensions
