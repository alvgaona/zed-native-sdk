name: Publish to zed-industries/extensions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
    steps:
      # Without the secret the action fails on its first API call with 401, which makes every tag
      # push look broken. Skip instead, and re-run this workflow once the token is set.
      - name: Report a missing token
        if: env.COMMITTER_TOKEN == ''
        run: echo "COMMITTER_TOKEN is not set, skipping the pull request to zed-industries/extensions" >> $GITHUB_STEP_SUMMARY
      - uses: huacnlee/zed-extension-action@v1
        if: env.COMMITTER_TOKEN != ''
        with:
          extension-name: native-sdk
          push-to: alvgaona/zed-extensions
