name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the manifests
        run: |
          python3 -c "import tomllib, glob; [tomllib.load(open(p, 'rb')) for p in ['extension.toml'] + glob.glob('languages/*/config.toml')]"
      - name: Build the extension
        run: |
          rustup target add wasm32-wasip2
          cargo build --target wasm32-wasip2 --release

  # Queries are checked against the grammar revision the manifest pins.
  queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check out the pinned grammar
        run: |
          rev=$(python3 -c "import tomllib; print(tomllib.load(open('extension.toml','rb'))['grammars']['native']['rev'])")
          git clone https://github.com/alvgaona/tree-sitter-native grammar
          git -C grammar checkout "$rev"
      - name: Install the tree-sitter CLI
        working-directory: grammar
        run: bun install --frozen-lockfile
      - name: Parse the samples
        working-directory: grammar
        run: ./node_modules/.bin/tree-sitter parse -q ../test/samples/*.native
      - name: Run every query against the samples
        working-directory: grammar
        run: |
          for q in ../languages/native/*.scm; do
            echo "== $(basename "$q")"
            ./node_modules/.bin/tree-sitter query "$q" ../test/samples/*.native >/dev/null
          done
