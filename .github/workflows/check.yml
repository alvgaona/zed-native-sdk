name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install the tree-sitter CLI
        working-directory: grammar
        run: bun install --frozen-lockfile
      - name: Regenerate the parser
        working-directory: grammar
        run: ./node_modules/.bin/tree-sitter generate
      # Zed compiles src/parser.c straight from the repo and never runs `tree-sitter generate`,
      # so a stale committed parser means Zed and CI disagree about the language.
      - name: Fail if the committed parser is stale
        run: git diff --exit-code grammar/src
      - name: Run the corpus tests
        working-directory: grammar
        run: ./node_modules/.bin/tree-sitter test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the manifests
        run: |
          python3 -c "import tomllib, glob; [tomllib.load(open(p, 'rb')) for p in ['extension.toml'] + glob.glob('languages/*/config.toml')]"
      - name: Build the extension
        run: |
          rustup target add wasm32-wasip2
          cargo build --target wasm32-wasip2 --release
