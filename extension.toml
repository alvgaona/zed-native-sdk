id = "native-sdk"
name = "Native SDK"
schema_version = 1
version = "0.1.0"
authors = ["alvgaona <alvgaona@gmail.com>"]
description = "Syntax highlighting and language server support for Native SDK .native markup"
repository = "https://github.com/alvgaona/zed-native-sdk"

[language_servers.native-markup]
name = "native markup"
languages = ["Native"]

