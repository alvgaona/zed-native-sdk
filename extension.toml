id = "native-sdk"
name = "Native SDK"
schema_version = 1
version = "0.0.1"
authors = ["alvgaona <alvgaona@gmail.com>"]
description = "Syntax highlighting and language server support for Native SDK .native markup"
repository = "https://github.com/alvgaona/zed-native-sdk"

[language_servers.native-markup]
name = "native markup"
languages = ["Native"]

# The key must stay `native`: Zed compiles with -Wl,--export=tree_sitter_<key>, so a hyphen would
# emit an invalid C symbol. Zed checks the repository out at `rev` and compiles src/parser.c, which
# is why the grammar repo commits its generated parser.
[grammars.native]
repository = "https://github.com/alvgaona/tree-sitter-native"
rev = "7a5b8678abf2ab4f0453f46ae99242dfc452c67c"
