name = "Native"
path_suffixes = ["native"]
autoclose_before = ">})"
block_comment = { start = "<!--", prefix = "", end = "-->", tab_size = 0 }
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "!--", end = " --", close = true, newline = false, not_in = ["comment", "string"] },
]

# No `grammar` key yet — it is Option<Arc<str>> in Zed's LanguageConfig, so the
# language loads without one. That buys file association, the picker entry,
# comment toggling and autoclose today; highlighting arrives with the grammar.
