name = "Native"
grammar = "native"
path_suffixes = ["native"]
autoclose_before = ">})"
block_comment = { start = "<!--", prefix = "", end = "-->", tab_size = 0 }
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "!--", end = " --", close = true, newline = false, not_in = ["comment", "string"] },
]

# `grammar` is Option<Arc<str>> in Zed's LanguageConfig — the language loads without one, which is
# how this shipped before the grammar existed: file association, picker entry, comment toggling and
# autoclose all come from this file, not from the tree.
